name: Send GiGO rain ranking to Discord

on:
  schedule:
    - cron: '17 21 * * *'
      timezone: 'Asia/Tokyo'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      GIGO_STORES_CSV: data/gigo_stores.csv
      TARGET_DAYS_AHEAD: '1'
      MORNING_START_HOUR: '6'
      MORNING_END_HOUR: '12'
      MIN_POP_PERCENT: '0'
      TOP_N: ''
      OPEN_METEO_BATCH_SIZE: '50'
      TZ: Asia/Tokyo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Send Discord message
        run: uv run --no-sync python -m scripts.gigo_rain_discord notify
